name: p2p_chat_app
description: "Decentralized Chat UI file & text transfer tool (Android <-> Windows)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.5.0
  file_picker: ^8.1.4
  flutter_rust_bridge: 2.13.0
  intl: ^0.20.2
  mobile_scanner: ^6.0.6
  open_filex: ^4.6.0
  pasteboard: ^0.6.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
