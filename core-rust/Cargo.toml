[package]
name = "p2p-chat-core"
version = "1.0.0"
edition = "2024"
description = "Core P2P encrypted file and chat transfer engine with LAN physical-NIC bypass for TUN/VPN coexistence."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
blake3 = "1"
flutter_rust_bridge = "=2.13.0"
iroh = "1.3"
noq = { version = "1.4", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
